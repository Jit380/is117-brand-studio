name: Publish EKO previews

on:
  push:
    branches: [feature/brand-001-first-branded-storefront]
    paths:
      - public/explorations/**
      - tests/browser/explorations.spec.js
      - .github/workflows/eko-previews.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eko-preview-pages
  cancel-in-progress: true

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Publish the EKO preview pages
        id: deployment
        uses: actions/deploy-pages@v5
