name: Publish EKO previews

on:
  push:
    branches: [feature/brand-001-first-branded-storefront]
    paths:
      - public/explorations/**
      - tests/browser/explorations.spec.js
      - .github/workflows/eko-previews.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eko-preview-pages
  cancel-in-progress: true

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Publish the EKO preview pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify both published previews
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os, time, urllib.request
          base = os.environ["PAGES_URL"].rstrip("/")
          for name in ("modernist", "postmodern"):
              url = f"{base}/explorations/{name}.html"
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(url, timeout=20) as response:
                          html = response.read().decode()
                      assert "A simple shirt." in html and 'id="eko-form"' in html
                      print(f"Verified HTTP 200 and EKO content: {url}")
                      break
                  except Exception:
                      if attempt == 5:
                          raise
                      time.sleep(5)
          PY
