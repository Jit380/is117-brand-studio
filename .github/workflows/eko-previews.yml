name: Publish EKO previews
run-name: EKO previews · ${{ github.ref_name }}

on:
  push:
    branches: [feature/brand-001-first-branded-storefront]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eko-preview-pages
  cancel-in-progress: true

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Save downloadable websites
        uses: actions/upload-artifact@v5
        with:
          name: EKO-previews
          path: public/explorations/EKO-previews.zip
      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' > "$RUNNER_TEMP/eko-pages-source" 2>/dev/null && [ "$(cat "$RUNNER_TEMP/eko-pages-source")" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Live publication skipped: enable GitHub Actions in repository Settings > Pages. Both downloadable websites are available in the EKO-previews artifact."
            echo 'Both previews passed checks and are available in the EKO-previews artifact. Live publication was skipped because Pages is not configured for GitHub Actions. Enable that source in Settings → Pages, then rerun this workflow.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: public
      - name: Publish the EKO preview pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify both published previews
        if: steps.pages.outputs.enabled == 'true'
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os, time, urllib.request
          base = os.environ["PAGES_URL"].rstrip("/")
          for name in ("modernist", "postmodern"):
              url = f"{base}/explorations/{name}.html"
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(url, timeout=20) as response:
                          html = response.read().decode()
                      assert "A simple shirt." in html and 'id="eko-form"' in html
                      print(f"Verified HTTP 200 and EKO content: {url}")
                      break
                  except Exception:
                      if attempt == 5:
                          raise
                      time.sleep(5)
          PY
